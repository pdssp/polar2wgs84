name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

# -----------------------------
# 🏷️ VERSION JOB
# -----------------------------
jobs:

  version:
    name: Compute Version
    runs-on: ubuntu-latest

    outputs:
      project_version: ${{ steps.ver.outputs.project_version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compute version from git
        id: ver
        run: |
          VERSION=$(git describe --tags --always)
          echo "project_version=$VERSION" >> $GITHUB_OUTPUT


# -----------------------------
# 🧪 TESTS
# -----------------------------
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: version

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          make prepare-dev
          make install-dev

      - name: Run tests + coverage
        run: |
          make coverage
          make coverage_xml

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            report.xml


# -----------------------------
# 📦 BUILD PACKAGE
# -----------------------------
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          make prepare-dev
          make install-dev

      - name: Build package
        run: make release

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/


# -----------------------------
# 📚 DOCS
# -----------------------------
  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: version

    env:
      PROJECT_VERSION: ${{ needs.version.outputs.project_version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cookiecutter uv
          make prepare-dev
          make install-dev

      - name: Build documentation
        run: make doc

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/


# -----------------------------
# 🚀 DEPLOY DOCS
# -----------------------------
  deploy-docs:
    name: Deploy Docs to GitHub Pages
    runs-on: ubuntu-latest
    needs: docs
    if: github.ref == 'refs/heads/main'

    permissions:
      pages: write
      id-token: write

    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5


# -----------------------------
# 🏷️ RELEASE (tags only)
# -----------------------------
  release:
      name: Release Build
      runs-on: ubuntu-latest
      needs: build
      if: startsWith(github.ref, 'refs/tags/')

      steps:
        - name: Download dist from build
          uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
          with:
            name: dist
            path: dist/

        - name: Upload release artifacts
          uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
          with:
            name: release-dist
            path: dist/


# -----------------------------
# 🚀 PUBLISH TO PYPI (tags only)
# -----------------------------
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/')

    environment: pypi
    permissions:
      id-token: write   # requis pour le trusted publishing OIDC

    steps:
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
