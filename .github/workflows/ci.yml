name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

# -----------------------------
# 🏷️ VERSION JOB
# -----------------------------
jobs:

  version:
    name: Compute Version
    runs-on: ubuntu-latest

    outputs:
      project_version: ${{ steps.ver.outputs.project_version }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compute version from git
        id: ver
        run: |
          VERSION=$(git describe --tags --always)
          echo "project_version=$VERSION" >> $GITHUB_OUTPUT


# -----------------------------
# 🧪 TESTS
# -----------------------------
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: version

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          make prepare-dev
          make install-dev

      - name: Run tests + coverage
        run: |
          make coverage
          make coverage_xml

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            report.xml


# -----------------------------
# 📦 BUILD PACKAGE
# -----------------------------
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          make prepare-dev
          make install-dev

      - name: Build package
        run: make release

      - name: Upload dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/


# -----------------------------
# 📚 DOCS
# -----------------------------
  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: version

    env:
      PROJECT_VERSION: ${{ needs.version.outputs.project_version }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cookiecutter uv
          make prepare-dev
          make install-dev

      - name: Build documentation
        run: make doc

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/


# -----------------------------
# 🚀 DEPLOY DOCS
# -----------------------------
  deploy-docs:
    name: Deploy Docs to GitHub Pages
    runs-on: ubuntu-latest
    needs: docs
    if: github.ref == 'refs/heads/main'

    permissions:
      pages: write
      id-token: write

    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4


# -----------------------------
# 🏷️ RELEASE (tags only)
# -----------------------------
  release:
      name: Release Build
      runs-on: ubuntu-latest
      needs: build
      if: startsWith(github.ref, 'refs/tags/')

      steps:
        - name: Download dist from build
          uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
          with:
            name: dist
            path: dist/

        - name: Upload release artifacts
          uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
          with:
            name: release-dist
            path: dist/


# -----------------------------
# 🚀 PUBLISH TO PYPI (tags only)
# -----------------------------
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/')

    environment: pypi
    permissions:
      id-token: write   # requis pour le trusted publishing OIDC

    steps:
      - name: Download dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
